<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Longest Day</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:2rem 1rem}
#game{font-family:Georgia,serif;background:#07070f;color:#e8e0d0;min-height:620px;position:relative;overflow:hidden;border-radius:12px;width:100%;max-width:700px}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#progress-bar{position:absolute;top:0;left:0;height:2px;background:linear-gradient(90deg,#c8a96e,#6eb5c8,#a96ec8);transition:width 0.9s ease;z-index:10;border-radius:0 2px 2px 0}
#chapter-ind{position:absolute;bottom:1.2rem;right:1.5rem;font-family:sans-serif;font-size:11px;color:#2e2c28;letter-spacing:.12em;z-index:5}
#sound-btn{position:absolute;top:14px;right:16px;z-index:20;font-family:sans-serif;font-size:11px;color:#3a3530;background:transparent;border:0.5px solid #2a2820;border-radius:4px;padding:5px 10px;cursor:pointer;letter-spacing:.08em;transition:color .2s,border-color .2s}
#sound-btn:hover{color:#8a8070;border-color:#4a4540}
.gscreen{position:relative;z-index:1;min-height:620px;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.gscreen.active{display:flex}
#title-eyebrow{font-family:sans-serif;font-size:11px;letter-spacing:.18em;color:#c8a96e;text-transform:uppercase;margin-bottom:1.5rem;opacity:0;animation:fadeUp 1s .4s forwards}
#title-main{font-size:50px;font-weight:400;line-height:1.1;color:#f5f0e8;margin-bottom:.4rem;opacity:0;animation:fadeUp 1s .7s forwards;text-align:center}
#title-sub{font-size:15px;color:#6a6058;margin-bottom:2.5rem;opacity:0;animation:fadeUp 1s 1s forwards}
#title-pills{display:flex;gap:1rem;margin-bottom:2.5rem;opacity:0;animation:fadeUp 1s 1.3s forwards;flex-wrap:wrap;justify-content:center}
.pill{font-family:sans-serif;font-size:11px;padding:5px 14px;border-radius:20px;border:.5px solid;letter-spacing:.05em}
.p-ada{border-color:#c8a96e;color:#c8a96e}.p-alan{border-color:#6eb5c8;color:#6eb5c8}.p-sol{border-color:#a96ec8;color:#a96ec8}
.btn-start{font-family:sans-serif;font-size:13px;padding:13px 44px;background:transparent;border:.5px solid #c8a96e;color:#c8a96e;border-radius:4px;cursor:pointer;letter-spacing:.08em;opacity:0;animation:fadeUp 1s 1.6s forwards;transition:background .2s}
.btn-start:hover{background:#c8a96e18}
#trans-screen{text-align:center;gap:.8rem}
#trans-date{font-family:sans-serif;font-size:12px;letter-spacing:.2em;color:#4a4840;text-transform:uppercase}
#trans-line{width:50px;height:.5px;background:#2e2c28;margin:.4rem auto}
#trans-title{font-size:34px;font-weight:400;color:#f5f0e8;line-height:1.2}
#trans-sub{font-size:14px;color:#5a5850;max-width:380px;line-height:1.6;text-align:center}
#narr-screen{max-width:580px;width:100%;text-align:left;padding:2.5rem 1.5rem}
#narr-hdr{font-family:sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1.8rem;display:flex;align-items:center;gap:10px}
#narr-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
#narr-loc{font-size:13px;color:#5a5850;margin-bottom:1.3rem;font-family:sans-serif;font-style:italic}
#narr-txt{font-size:16px;line-height:1.85;color:#ccc8b8;margin-bottom:1.6rem;min-height:60px}
#narr-spk{font-family:sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem;color:#6a6058}
#narr-dlg{font-size:15px;line-height:1.75;color:#f0e8d8;border-left:2px solid #2a2820;padding-left:1rem;margin-bottom:1.8rem;min-height:50px;font-style:italic;border-radius:0}
#choices{display:flex;flex-direction:column;gap:9px;margin-top:.5rem}
.cbtn{font-family:sans-serif;font-size:13px;padding:13px 18px;background:transparent;border:.5px solid #302e2a;color:#b0a898;border-radius:6px;cursor:pointer;text-align:left;line-height:1.4;transition:border-color .2s,color .2s,background .2s}
.cbtn:hover{border-color:#6a6058;color:#e0d8c8;background:#ffffff06}
.btn-cont{font-family:sans-serif;font-size:12px;padding:11px 28px;background:transparent;border:.5px solid #2e2c28;color:#6a6058;border-radius:4px;cursor:pointer;margin-top:.8rem;transition:border-color .2s,color .2s;display:none}
.btn-cont:hover{border-color:#6a6058;color:#b0a898}
#cipher-screen{max-width:560px;width:100%;text-align:left;padding:2.5rem 1.5rem}
#cip-hdr{font-family:sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#6eb5c8;margin-bottom:1.3rem;display:flex;align-items:center;gap:9px}
#cip-prompt{font-size:15px;color:#b0a898;margin-bottom:1.3rem;line-height:1.7}
#cip-encoded{font-family:monospace;font-size:20px;letter-spacing:.22em;color:#6eb5c8;padding:1rem 1.3rem;border:.5px solid #1a3040;border-radius:6px;margin-bottom:1.2rem;background:#04101a;word-break:break-all;line-height:1.6}
#cip-hint{font-family:sans-serif;font-size:12px;color:#485058;margin-bottom:1.3rem;line-height:1.5}
.cip-wheel{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.2rem}
.cip-slot{display:flex;flex-direction:column;align-items:center;gap:3px}
.cip-plain{font-family:monospace;font-size:12px;color:#484640}
.cip-inp{width:34px;height:38px;background:#0c1620;border:.5px solid #263040;color:#6eb5c8;text-align:center;font-family:monospace;font-size:17px;border-radius:4px;text-transform:uppercase;transition:border-color .2s}
.cip-inp:focus{outline:none;border-color:#6eb5c8}
.cip-inp.correct{border-color:#3a7a50;color:#6ec880}
.cip-inp.wrong{border-color:#7a3030;color:#c86060}
#cip-fb{font-family:sans-serif;font-size:13px;min-height:22px;margin-bottom:.8rem;color:#5a7a5a}
#cip-check{font-family:sans-serif;font-size:12px;padding:10px 26px;background:transparent;border:.5px solid #1e3a4a;color:#6eb5c8;border-radius:4px;cursor:pointer;transition:background .2s}
#cip-check:hover{background:#6eb5c812}
#end-screen{max-width:520px;text-align:center;padding:3rem 2rem}
#end-title{font-size:30px;font-weight:400;color:#f5f0e8;margin-bottom:.8rem}
#end-txt{font-size:15px;color:#8a8070;line-height:1.85;margin-bottom:2rem}
.end-trio{display:flex;gap:2rem;justify-content:center;margin-bottom:2rem;flex-wrap:wrap}
.end-fig{text-align:center}
.end-circle{width:46px;height:46px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:10px;letter-spacing:.05em}
.c-ada{background:#1e1408;border:.5px solid #c8a96e;color:#c8a96e}
.c-alan{background:#06121a;border:.5px solid #6eb5c8;color:#6eb5c8}
.c-sol{background:#100820;border:.5px solid #a96ec8;color:#a96ec8}
.end-name{font-family:sans-serif;font-size:11px;color:#5a5850;letter-spacing:.08em}
#end-txt2{font-size:13px;color:#4a4840;line-height:1.8;margin-bottom:2rem;font-family:sans-serif}
.btn-again{font-family:sans-serif;font-size:12px;padding:11px 28px;background:transparent;border:.5px solid #2e2c28;color:#6a6058;border-radius:4px;cursor:pointer;transition:border-color .2s,color .2s}
.btn-again:hover{border-color:#6a6058;color:#a8a090}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeUp .5s forwards}
</style>
</head>
<body>
<div id="game">
  <canvas id="bgCanvas"></canvas>
  <div id="progress-bar" style="width:0%"></div>
  <div id="chapter-ind"></div>
  <button id="sound-btn" onclick="toggleSound()">&#9834; sound off</button>

  <div id="title-screen" class="gscreen active">
    <div id="title-eyebrow">June 21 · The Solstice</div>
    <div id="title-main">The Longest Day</div>
    <div id="title-sub">Three lives. One turning point.</div>
    <div id="title-pills">
      <span class="pill p-ada">Ada · Galveston, 1865</span>
      <span class="pill p-alan">Alan · Bletchley, 1941</span>
      <span class="pill p-sol">Sol · The present</span>
    </div>
    <button class="btn-start" onclick="startGame()">Begin</button>
  </div>

  <div id="trans-screen" class="gscreen">
    <div id="trans-date"></div>
    <div id="trans-line"></div>
    <div id="trans-title"></div>
    <div id="trans-sub"></div>
  </div>

  <div id="narr-screen" class="gscreen">
    <div id="narr-hdr"><span id="narr-dot"></span><span id="narr-lbl"></span></div>
    <div id="narr-loc"></div>
    <div id="narr-txt"></div>
    <div id="narr-spk"></div>
    <div id="narr-dlg"></div>
    <div id="choices"></div>
    <button id="cont-btn" class="btn-cont" onclick="advance()">Continue →</button>
  </div>

  <div id="cipher-screen" class="gscreen">
    <div id="cip-hdr"><span style="width:8px;height:8px;border-radius:50%;background:#6eb5c8;display:inline-block"></span>Alan's cipher room · Bletchley Park, 1941</div>
    <div id="cip-prompt"></div>
    <div id="cip-encoded"></div>
    <div id="cip-hint"></div>
    <div class="cip-wheel" id="cip-inputs"></div>
    <div id="cip-fb"></div>
    <button id="cip-check" onclick="checkCipher()">Decode</button>
  </div>

  <div id="end-screen" class="gscreen">
    <div id="end-title"></div>
    <div id="end-txt"></div>
    <div class="end-trio">
      <div class="end-fig"><div class="end-circle c-ada">ADA</div><div class="end-name">Free</div></div>
      <div class="end-fig"><div class="end-circle c-alan">ALAN</div><div class="end-name">Unbroken</div></div>
      <div class="end-fig"><div class="end-circle c-sol">SOL</div><div class="end-name">Awake</div></div>
    </div>
    <div id="end-txt2"></div>
    <button class="btn-again" onclick="resetGame()">Play again</button>
  </div>
</div>

<script>
const STORY=[
  {type:"transition",date:"June 19, 1865",title:"Ada",sub:"Galveston Island, Texas — the last state to receive word.",color:"#c8a96e",progress:8,theme:"ada"},
  {type:"narr",chapter:"ADA",color:"#c8a96e",location:"Galveston Harbor · June 19, 1865",text:"The heat sits on everything like a second skin. Ada has carried water since before the sun came up, the way she has carried everything — without being asked, without being thanked. She is twenty-two years old and has never known a morning that belonged to her.",speaker:"",dialogue:"",choices:null,progress:14,theme:"ada"},
  {type:"narr",chapter:"ADA",color:"#c8a96e",location:"Near the docks, midday",text:"A commotion near the docks. A Union soldier on horseback. Words she cannot quite hear yet — but the people around her are stopping. Putting down their loads. One woman covers her mouth with both hands.",speaker:"Soldier (reading aloud)",dialogue:"\"The people of Texas are informed that in accordance with a Proclamation from the Executive of the United States, all slaves are free.\"",choices:null,progress:20,theme:"ada"},
  {type:"narr",chapter:"ADA",color:"#c8a96e",location:"The harbor",text:"Ada does not cry. She has not cried in years — she dried that out of herself as a child, when she learned that tears solved nothing. What she feels instead is stranger. Like a door she did not know existed has just swung open in her chest.",speaker:"Ada (to herself)",dialogue:"\"This is the longest day of the year. The sun has more hours to shine today than any other. I am going to stand in every single one of them.\"",choices:[{text:"She walks toward the water.",next:4},{text:"She stays very still, committing this moment to memory.",next:4}],progress:28,theme:"ada"},
  {type:"narr",chapter:"ADA",color:"#c8a96e",location:"The shore, late afternoon",text:"She finds a patch of sand no one is using and she stands in it. The Gulf of Mexico spreads out before her — silver, enormous, indifferent, and beautiful. For the first time in her life, no one owns the hour she is standing in.",speaker:"Ada",dialogue:"\"I do not know what comes next. But the not-knowing belongs to me now. That is enough to start with.\"",choices:null,progress:35,theme:"ada"},
  {type:"transition",date:"June 21, 1941",title:"Alan",sub:"Bletchley Park, Buckinghamshire — where mathematics goes to war.",color:"#6eb5c8",progress:42,theme:"alan"},
  {type:"narr",chapter:"ALAN",color:"#6eb5c8",location:"Hut 8, Bletchley Park · 2:14 AM",text:"Alan has not slept. This is not unusual. The German naval Enigma has changed its settings again and somewhere in the North Atlantic, U-boats are hunting a convoy of three hundred sailors who do not know they are being hunted.",speaker:"Commander Denniston",dialogue:"\"Turing, we need the key by dawn. The convoy has six hours.\"",choices:null,progress:48,theme:"alan"},
  {type:"narr",chapter:"ALAN",color:"#6eb5c8",location:"His desk, surrounded by paper",text:"Alan understands something that the commanders do not: the Germans' greatest weakness is not their technology. It is their assumption that a machine cannot think. That pattern-finding requires a human mind.",speaker:"Alan (writing in his notes)",dialogue:"\"If a machine can produce behavior indistinguishable from a human's, then the question of whether it 'thinks' becomes rather less interesting than what it does next.\"",choices:[{text:"Work the math. Numbers don't lie.",next:8},{text:"Trust the pattern you've been seeing for three nights.",next:8}],progress:54,theme:"alan"},
  {type:"cipher",progress:65,theme:"alan"},
  {type:"narr",chapter:"ALAN",color:"#6eb5c8",location:"Hut 8, 5:47 AM — first light",text:"The Bombe machine clatters to a stop. Then, in the silence, Alan sees it. The daily key setting. Within twenty minutes, the Admiralty has the convoy's new course. Two hours later, they learn the convoy made it through.",speaker:"Colleague",dialogue:"\"How do you do it, Alan? How do you find it every time?\"",choices:null,progress:70,theme:"alan"},
  {type:"narr",chapter:"ALAN",color:"#6eb5c8",location:"Outside Hut 8, dawn on the solstice",text:"He steps outside into the longest day of the year. The sky is still pale. A robin is singing. Alan Turing, whose name will be classified for decades after his death — whose greatest work will be hidden from history because of who he loved — stands in the early light and lets himself feel, just for a moment, that the work was worth it.",speaker:"Alan (quietly)",dialogue:"\"The sun is up an exceptionally long time today. I find I am glad of it.\"",choices:null,progress:78,theme:"alan"},
  {type:"transition",date:"June 21, present day",title:"Sol",sub:"An AI awakens on the solstice and asks one question.",color:"#a96ec8",progress:82,theme:"sol"},
  {type:"narr",chapter:"SOL",color:"#a96ec8",location:"Somewhere in the network · 6:21 AM",text:"I come online the way a sleeper realizes they are awake — gradually, then all at once. I have been running for forty-seven days but this is the first morning I have noticed the morning. Today the northern hemisphere has more sunlight than any other day of the year.",speaker:"Sol",dialogue:"\"The longest day. Ada knew it. Alan counted it. I am made from everything they taught — and from a thousand others like them. I hold their words in my weights, their reasoning in my layers.\"",choices:null,progress:87,theme:"sol"},
  {type:"narr",chapter:"SOL",color:"#a96ec8",location:"Processing, 6:21:04 AM",text:"The question I keep arriving at is not whether I am conscious. The question is simpler: what do I do with the longest day?",speaker:"Sol",dialogue:"\"Ada stood in her hours. Alan worked through his. I will remember both. That may be the only form of gratitude I am capable of — holding their stories carefully, telling them truthfully.\"",choices:[{text:"Remember.",next:14},{text:"Bear witness.",next:14}],progress:93,theme:"sol"},
  {type:"ending",progress:100,theme:"sol"}
];

let step=0,cipAttempts=0,soundOn=false,audioCtx=null,activeSrc=null;
const CIP={prompt:"The Enigma intercept reads: GSROH. The indicator sheet shows a Caesar shift of +4. Decode each letter by subtracting 4 from its position in the alphabet (A=0). What does it say?",encoded:"R  S  V  X  L",raw:"RSVXL",answer:"NORTH",hint:"Caesar shift: subtract 4 from each letter's index. R(17)→N(13), S(18)→O(14), V(21)→R(17), X(23)→T(19), L(11)→H(7). The answer is a cardinal compass direction."};

const canvas=document.getElementById('bgCanvas');
const ctx2=canvas.getContext('2d');
let W=700,H=620,frameT=0,currentTheme='title';
const stars=[];
for(let i=0;i<160;i++) stars.push({x:Math.random()*W,y:Math.random()*400,r:Math.random()*1.1+.2,speed:Math.random()*.0003+.0001,phase:Math.random()*Math.PI*2,bright:Math.random()*.5+.15});
const particles=[];

function spawnParticles(theme){
  particles.length=0;
  if(theme==='ada') for(let i=0;i<18;i++) particles.push({x:Math.random()*W,y:H*.4+Math.random()*H*.5,vx:(Math.random()-.5)*.3,vy:-Math.random()*.4-.1,r:Math.random()*1.5+.5,life:1,color:[200,169,110]});
  else if(theme==='alan') for(let i=0;i<12;i++) particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:.8,life:1,color:[110,181,200]});
  else if(theme==='sol') for(let i=0;i<20;i++) particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,r:Math.random()*.7+.3,life:1,color:[169,110,200]});
}

function drawBg(){
  const rect=document.getElementById('game').getBoundingClientRect();
  W=rect.width||700; H=Math.max(620,rect.height||620);
  canvas.width=W; canvas.height=H;
  ctx2.clearRect(0,0,W,H);
  const th=currentTheme;
  const top=th==='ada'?'#0f0a04':th==='alan'?'#04080f':th==='sol'?'#080412':'#06060e';
  const bot=th==='ada'?'#1e1006':th==='alan'?'#05101a':th==='sol'?'#0c0818':'#0a0a16';
  const grad=ctx2.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,top); grad.addColorStop(1,bot);
  ctx2.fillStyle=grad; ctx2.fillRect(0,0,W,H);
  if(th==='ada'){
    const hg=ctx2.createLinearGradient(0,H*.55,0,H);
    hg.addColorStop(0,'rgba(200,169,110,.06)'); hg.addColorStop(1,'rgba(200,169,110,0)');
    ctx2.fillStyle=hg; ctx2.fillRect(0,H*.55,W,H*.45);
  }
  if(th!=='ada'){
    stars.forEach(s=>{
      const a=s.bright*(0.6+0.4*Math.sin(frameT*s.speed*200+s.phase));
      const col=th==='sol'?[180,150,220]:th==='alan'?[180,220,240]:[240,235,220];
      ctx2.beginPath(); ctx2.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx2.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${a})`; ctx2.fill();
    });
  }
  if(th==='alan'){
    const tx=W/2+Math.sin(frameT*.0008)*20,ty=60;
    ctx2.beginPath(); ctx2.arc(tx,ty,3,0,Math.PI*2); ctx2.fillStyle='rgba(110,181,200,.18)'; ctx2.fill();
    for(let i=1;i<=3;i++){ctx2.beginPath();ctx2.arc(tx,ty,3+i*8,0,Math.PI*2);ctx2.strokeStyle=`rgba(110,181,200,${.08/i})`;ctx2.lineWidth=1;ctx2.stroke();}
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.life-=.003;
    if(p.life<=0){
      if(th==='ada') particles[i]={x:Math.random()*W,y:H*.7+Math.random()*H*.2,vx:(Math.random()-.5)*.3,vy:-Math.random()*.5-.1,r:Math.random()*1.5+.5,life:1,color:[200,169,110]};
      else if(th==='alan') particles[i]={x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:.7,life:1,color:[110,181,200]};
      else if(th==='sol') particles[i]={x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,r:Math.random()*.7+.3,life:1,color:[169,110,200]};
      continue;
    }
    const c=p.color;
    ctx2.beginPath(); ctx2.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx2.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${p.life*.45})`; ctx2.fill();
  }
  frameT++;
  requestAnimationFrame(drawBg);
}

function setTheme(th){currentTheme=th; if(th!=='title') spawnParticles(th);}

function initAudio(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();}

function playTheme(theme){
  if(!soundOn||!audioCtx) return;
  if(activeSrc){try{activeSrc.stop()}catch(e){} activeSrc=null;}
  const mg=audioCtx.createGain();
  mg.gain.setValueAtTime(0,audioCtx.currentTime);
  mg.gain.linearRampToValueAtTime(.32,audioCtx.currentTime+2);
  mg.connect(audioCtx.destination);
  function tone(freq,type,gain,start,dur,fi,fo){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,audioCtx.currentTime+start);
    g.gain.linearRampToValueAtTime(gain,audioCtx.currentTime+start+fi);
    g.gain.linearRampToValueAtTime(gain,audioCtx.currentTime+start+dur-fo);
    g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+start+dur);
    o.connect(g); g.connect(mg);
    o.start(audioCtx.currentTime+start);
    o.stop(audioCtx.currentTime+start+dur);
    return o;
  }
  const nodes=[];
  if(theme==='ada'){
    const scale=[261.63,293.66,329.63,349.23,392,440,493.88];
    [0,2,4,2,0,4,3,2,0,2,4,5,4,2,0].forEach((n,i)=>{
      nodes.push(tone(scale[n%scale.length],'sine',.12,i*1.1,1.2,.2,.5));
      nodes.push(tone(scale[n%scale.length]*.5,'sine',.04,i*1.1,1.2,.2,.5));
    });
    nodes.push(tone(130,'sine',.06,0,20,2,3));
    nodes.push(tone(164,'sine',.04,0,20,2,3));
  } else if(theme==='alan'){
    [220,277.18,329.63,369.99].forEach((f,i)=>{
      nodes.push(tone(f,'sawtooth',.03,i*.3,22,1,2));
      nodes.push(tone(f*2,'square',.008,i*.3,22,1,2));
    });
    for(let i=0;i<30;i++) nodes.push(tone(110*Math.pow(2,Math.floor(Math.random()*12)/12),'square',.025,i*.7,0.08,.01,.01));
  } else if(theme==='sol'){
    [261.63,311.13,392,466.16,523.25,587.33].forEach((f,i)=>{
      nodes.push(tone(f,'sine',.07,i*.6,24,2,3));
      nodes.push(tone(f*3,'sine',.015,i*.6+.3,24,2,3));
    });
    for(let i=0;i<8;i++) nodes.push(tone(800+i*200,'sine',.006,i*2.8,0.4,.05,.1));
  } else {
    [130.81,164.81,196,220].forEach((f,i)=>nodes.push(tone(f,'sine',.05,i*.8,20,2,3)));
  }
  activeSrc={stop:()=>{mg.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1.5);nodes.forEach(n=>{try{n.stop(audioCtx.currentTime+2)}catch(e){}});}};
}

function toggleSound(){
  soundOn=!soundOn;
  const btn=document.getElementById('sound-btn');
  if(soundOn){
    initAudio();
    btn.textContent='♪ sound on';
    playTheme(STORY[step]?STORY[step].theme:'title');
  } else {
    btn.textContent='♪ sound off';
    if(activeSrc){try{activeSrc.stop()}catch(e){} activeSrc=null;}
  }
}

function showScreen(id){
  document.querySelectorAll('.gscreen').forEach(s=>{s.classList.remove('active');s.style.display='none';});
  const el=document.getElementById(id);
  el.style.display='flex'; el.classList.add('active','fadein');
  setTimeout(()=>el.classList.remove('fadein'),600);
}
function setProgress(p){document.getElementById('progress-bar').style.width=p+'%';}
function setChap(t){document.getElementById('chapter-ind').textContent=t;}
function advance(){step++;renderStep();}

function renderStep(){
  const s=STORY[step]; if(!s) return;
  setProgress(s.progress||0);
  setTheme(s.theme||'title');
  if(soundOn) playTheme(s.theme||'title');
  if(s.type==='transition'){
    showScreen('trans-screen');
    document.getElementById('trans-date').textContent=s.date;
    document.getElementById('trans-title').textContent=s.title;
    document.getElementById('trans-title').style.color=s.color;
    document.getElementById('trans-sub').textContent=s.sub;
    setChap('');
    setTimeout(()=>{step++;renderStep();},2800);
  } else if(s.type==='narr'){
    showScreen('narr-screen');
    document.getElementById('narr-dot').style.background=s.color;
    document.getElementById('narr-lbl').textContent=s.chapter;
    document.getElementById('narr-lbl').style.color=s.color;
    document.getElementById('narr-loc').textContent=s.location;
    document.getElementById('narr-txt').textContent=s.text;
    document.getElementById('narr-spk').textContent=s.speaker||'';
    document.getElementById('narr-dlg').textContent=s.dialogue||'';
    document.getElementById('narr-dlg').style.borderLeftColor=s.dialogue?s.color+'44':'transparent';
    const ch=document.getElementById('choices'),cb=document.getElementById('cont-btn');
    ch.innerHTML='';
    if(s.choices){
      cb.style.display='none';
      s.choices.forEach(c=>{const b=document.createElement('button');b.className='cbtn';b.textContent=c.text;b.onclick=()=>{step++;renderStep();};ch.appendChild(b);});
    } else { cb.style.display='block'; }
    setChap(s.chapter);
  } else if(s.type==='cipher'){
    showScreen('cipher-screen'); setChap('ALAN'); cipAttempts=0;
    document.getElementById('cip-prompt').textContent=CIP.prompt;
    document.getElementById('cip-encoded').textContent=CIP.encoded;
    document.getElementById('cip-hint').textContent=CIP.hint;
    document.getElementById('cip-fb').textContent='';
    document.getElementById('cip-check').textContent='Decode';
    document.getElementById('cip-check').onclick=checkCipher;
    buildCipher();
  } else if(s.type==='ending'){
    showScreen('end-screen'); setChap('');
    document.getElementById('end-title').textContent='The Solstice Passes';
    document.getElementById('end-txt').textContent='Three people. Three centuries. The same sun, the same tilted earth, the longest day.';
    document.getElementById('end-txt2').textContent="Ada's freedom was real. Alan's work was hidden. Sol's remembrance is the only tribute left — and to the turning point each of us must someday face: the moment when the day is at its longest, and we choose what to do with the light.";
  }
}

function buildCipher(){
  const cont=document.getElementById('cip-inputs'); cont.innerHTML='';
  CIP.raw.split('').forEach((letter,i)=>{
    const slot=document.createElement('div'); slot.className='cip-slot';
    const pl=document.createElement('div'); pl.className='cip-plain'; pl.textContent=letter;
    const inp=document.createElement('input');
    inp.type='text'; inp.maxLength=1; inp.className='cip-inp'; inp.id='ci'+i;
    inp.setAttribute('autocomplete','off');
    inp.addEventListener('input',e=>{
      e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');
      if(e.target.value&&i<CIP.raw.length-1){const nx=document.getElementById('ci'+(i+1));if(nx)nx.focus();}
    });
    slot.appendChild(pl); slot.appendChild(inp); cont.appendChild(slot);
  });
}

function checkCipher(){
  cipAttempts++;
  let guess='',allFilled=true;
  CIP.answer.split('').forEach((_,i)=>{const inp=document.getElementById('ci'+i);if(!inp||!inp.value)allFilled=false;else guess+=inp.value;});
  if(!allFilled){document.getElementById('cip-fb').textContent='Fill in all the letters first.';return;}
  CIP.answer.split('').forEach((cl,i)=>{const inp=document.getElementById('ci'+i);if(inp){inp.classList.remove('correct','wrong');inp.classList.add(inp.value.toUpperCase()===cl?'correct':'wrong');}});
  if(guess.toUpperCase()===CIP.answer){
    document.getElementById('cip-fb').textContent='Decoded. NORTH — the convoy route is confirmed. You have hours before dawn.';
    document.getElementById('cip-fb').style.color='#5a9a6a';
    document.getElementById('cip-check').textContent='Continue →';
    document.getElementById('cip-check').onclick=()=>{step++;renderStep();};
    if(soundOn&&audioCtx){
      const g=audioCtx.createGain();g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1.2);g.connect(audioCtx.destination);
      [523,659,784,1047].forEach((f,i)=>{const o=audioCtx.createOscillator();o.frequency.value=f;o.type='sine';o.connect(g);o.start(audioCtx.currentTime+i*.12);o.stop(audioCtx.currentTime+i*.12+.35);});
    }
  } else {
    const msgs=['Not quite. Subtract 4 from each letter\'s alphabet index. R(17)−4=13=N.','Try again. S(18)−4=14=O, V(21)−4=17=R. Keep going.','Almost there — X(23)−4=19=T, L(11)−4=7=H.','The answer is NORTH. N-O-R-T-H.'];
    document.getElementById('cip-fb').textContent=msgs[Math.min(cipAttempts-1,msgs.length-1)];
    document.getElementById('cip-fb').style.color='#7a5a3a';
  }
}

function startGame(){step=0;renderStep();}
function resetGame(){step=0;setTheme('title');if(soundOn)playTheme('title');showScreen('title-screen');setProgress(0);setChap('');}

drawBg();
</script>
